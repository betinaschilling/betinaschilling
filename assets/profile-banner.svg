<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Cheila Betina — Data Science, Forecasting and Analytical Systems</title>
  <desc id="desc">Dark technical banner with a time-series signal, grid, analytical nodes and the phrase model uncertainty, explain evidence, build decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="0.55" stop-color="#11172a"/>
      <stop offset="1" stop-color="#071d22"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect x="20" y="20" width="1160" height="320" rx="18" fill="url(#grid)" stroke="#94a3b8" stroke-opacity=".12"/>

  <g opacity=".8">
    <path d="M690 255 L735 240 L770 252 L815 190 L850 214 L892 135 L930 174 L970 105 L1010 146 L1055 82 L1090 108"
          fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <path d="M690 274 H1110" stroke="#94a3b8" stroke-opacity=".16"/>
    <path d="M690 224 H1110 M690 174 H1110 M690 124 H1110" stroke="#94a3b8" stroke-opacity=".08"/>
    <g fill="#0f172a" stroke="#38bdf8" stroke-width="2">
      <circle cx="815" cy="190" r="6"/><circle cx="892" cy="135" r="6"/><circle cx="970" cy="105" r="6"/><circle cx="1055" cy="82" r="6"/>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="90" fill="#2dd4bf" font-size="15" letter-spacing="4">DATA · EVIDENCE · DECISION</text>
    <text x="68" y="154" fill="#f8fafc" font-size="48" font-weight="700" letter-spacing="-1">CHEILA BETINA</text>
    <text x="70" y="198" fill="#cbd5e1" font-size="23" letter-spacing=".5">Data Science · Forecasting · Analytical Systems</text>
    <text x="70" y="260" fill="#94a3b8" font-size="17">Modelar incerteza  ·  Explicar evidências  ·  Construir decisões</text>
  </g>

  <g transform="translate(70 296)">
    <rect width="10" height="10" rx="2" fill="#8b5cf6"/>
    <rect x="22" width="10" height="10" rx="2" fill="#38bdf8"/>
    <rect x="44" width="10" height="10" rx="2" fill="#2dd4bf"/>
  </g>
</svg>
