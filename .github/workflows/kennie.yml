name: CidadaoKennie Status

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ask Kennie for today's judgment
        run: python scripts/kennie_status.py

      - name: Commit changed status
        run: |
          if git diff --quiet; then
            echo "Kennie has nothing new to judge."
            exit 0
          fi
          git config user.name "CidadaoKennie"
          git config user.email "actions@users.noreply.github.com"
          git add assets/kennie-status.svg
          git commit -m "chore: Kennie judges today's data"
          git push
